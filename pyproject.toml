[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "research-data-store"
version = "0.1.0"
description = "A provenance-first ECCC climate research data store"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Abdelrahman Altawil"}]
dependencies = [
  "duckdb>=1.1",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "timezonefinder>=8.3,<9",
  "timezonefinder-data==1.2026.3",
  "tzdata==2026.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5"]

[project.scripts]
research-store = "research_store.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_store"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
