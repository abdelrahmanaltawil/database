name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request makes its older run moot, so runs of one pull
# request share a group and the older is cancelled. A push to main gets a group
# of its own commit: merging pull requests in a row must leave every commit on
# main with its own result, and a shared group would cancel or drop all but
# the newest.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml; 3.12 is what the store
        # is run with.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Test
        # Tests build their stores under pytest's tmp_path. Pointing the default
        # root at scratch space keeps anything that falls back to it out of the
        # checkout.
        env:
          RESEARCH_DATA_ROOT: ${{ runner.temp }}/research-data
        run: python -m pytest
